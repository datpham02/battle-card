lifecycle:
  states: [candidate, accepted, installed, approved, legacy]
  transitions:
    candidate: [accepted, legacy]
    accepted: [installed, candidate, legacy]
    installed: [approved, candidate, legacy]
    approved: [legacy]
    legacy: []
  user_only: [accepted, approved]
  events:
  - generation_started
  - generation_completed
  - candidate_created
  - qa_completed
  - user_accepted
  - integration_completed
  - user_approved
  - candidate_rejected
  - version_retired
  - registered
  - note
providers:
  pixellab:
    tool: "PixelLab MCP (https://api.pixellab.ai/mcp, registered for this project in ~/.claude.json)"
    used_for: "characters, character animation, image assets with a visual reference, tiles, free vfx_workbench / pixelart_workbench"
    version: "live service; API reference verified 2026-11-01 (.claude/skills/pixellab-animation-engineer/references/pixellab-api-reference.md)"
    paid: true
    doc: design/art/pixellab-profile.md
  pixelfx:
    tool: "pixelfx (https://github.com/patch-gg/pixelfx) — procedural pixel-art effects as JavaScript, Node 18+, sprite sheet + Aseprite-style JSON export"
    used_for: "candidate tool for combat / magic / fire / projectile / impact / status / environment / UI effects and procedural animations; complements fx-pipeline, never a runtime in Godot"
    installed_plugin: "pixelfx@pixelfx 0.3.0, scope user, commit a84159688af3ca37a4be05a0d422b94451b2e24e (2026-10-31), cache C:/Users/ADMIN/.claude/plugins/cache/pixelfx/pixelfx/0.3.0 (skill .claude-plugin + skills/pixelfx/SKILL.md)"
    authoring_checkout: "C:/WorkSpace/research/pixelfx (same commit a841596; outside the game repo; records/ holds renders)"
    upstream_head_seen: "044e12a45dc9cc312cec50ee606dfc98afe5adc2 (git ls-remote 2026-11-11) — newer than the installed 0.3.0; not updated (user decision)"
    license: "MIT (Copyright (c) 2026 Patch, Copyright (c) 2026 Hugo Duprez); NOTICE.md: src/core/sim.js and 202 effect files adapt Sprite Fusion pixel-art VFX (MIT, Hugo Duprez); src/core/act.js adapts Hollow Crown (MIT, rehan-remade); gallery/fonts is NOT MIT (Patch's own font) — never copy it"
    paid: false
    doc: docs/art/PIXELFX_INTEGRATION.md
  fx-pipeline:
    tool: "tools/fx-pipeline/fxc.py + fxkit (Tessera's own square-only procedural VFX, Python stdlib; structure follows pixelfx per tools/fx-pipeline/NOTICE.md, no code copied)"
    used_for: "square-only skill VFX rendered per cell size into VfxPack manifests; checks palette / alpha / red / border / overlay length"
    version: "fxc 0.1 (manifest app string)"
    paid: false
    doc: tools/fx-pipeline/README.md
  script:
    tool: "deterministic Python / Godot scripts in tools/asset-pipeline, tools/qa, design/assets/candidates/*/scripts"
    used_for: "UI plates, map icons, slab 9-slice, thorns, composites, sheet export"
    paid: false
  hand:
    tool: "manual pixel edits (earlier workbench edits only; the 2026-11-11 hand-painted cast_hand pass was dropped)"
    used_for: "exception only — the user's rule is mechanical edits on generated sprites"
    paid: false
  data:
    tool: "hand-written JSON configuration"
    used_for: "index and region files under assets/art"
    paid: false

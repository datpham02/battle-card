<h1>Đòn kiếm: sóng tràn qua vùng</h1>
<p>Ghi trong game. Lấy đà → chém → sóng kiếm bay tới ô đầu tiên → chảy tiếp qua các ô của vùng như sóng biển. Goblin chớp trắng và chữ HIT hiện khi sóng tới ô của nó. Hình sóng vẫn là bản workbench, chưa gen.</p>
